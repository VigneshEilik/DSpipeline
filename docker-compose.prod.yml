# ==============================================================================
# ModelOps Studio — Production Infrastructure Compose (docker-compose.prod.yml)
# ==============================================================================

services:
  # ----------------------------------------------------
  # Relational Database: PostgreSQL 16
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: modelops-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-modelops_db}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - modelops-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelops_user} -d ${POSTGRES_DB:-modelops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------
  # Cache & Celery Broker: Redis 7
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: modelops-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    networks:
      - modelops-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ----------------------------------------------------
  # Object Storage: MinIO S3-Compatible Storage
  # ----------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: modelops-prod-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-prod-data:/data
    networks:
      - modelops-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # MinIO Bucket Provisioner
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: modelops-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - modelops-internal
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-modelops-artifacts} --ignore-existing;
      exit 0;
      "

  # ----------------------------------------------------
  # MLflow Tracking Server
  # ----------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: modelops-prod-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - modelops-internal
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-modelops_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-modelops_db}
      --default-artifact-root s3://${MINIO_BUCKET_NAME:-modelops-artifacts}/mlflow
      --host 0.0.0.0
      --port 5000

  # ----------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: modelops-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-modelops_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-modelops_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - USE_IN_PROCESS_WORKER=false
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-modelops-artifacts}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://web:3000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,api,web}
    networks:
      - modelops-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------
  # Celery Asynchronous ML Worker
  # ----------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: modelops-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-modelops_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-modelops_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-modelops-artifacts}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - modelops-internal
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M

  # ----------------------------------------------------
  # Frontend Web Service: Next.js
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: modelops-prod-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - modelops-internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ----------------------------------------------------
  # Prometheus Metrics Collector
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: modelops-prod-prometheus
    restart: unless-stopped
    networks:
      - modelops-internal
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-prod-data:/prometheus

  # ----------------------------------------------------
  # Grafana Dashboards
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: modelops-prod-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-prod-data:/var/lib/grafana
    networks:
      - modelops-internal

networks:
  modelops-internal:
    driver: bridge

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
  prometheus-prod-data:
  grafana-prod-data:
